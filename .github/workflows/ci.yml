name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck install.sh server/*.sh server/scripts/*.sh firmware/build.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Byte-compile
        run: python -m compileall -q server
      - name: Tests
        run: python -m unittest discover -s tests -v
